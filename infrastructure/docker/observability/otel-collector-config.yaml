# Configuração do OpenTelemetry Collector — Fase 14.
#
# A partir desta fase o Collector deixa de apenas imprimir a telemetria no próprio log (exporter "debug",
# introduzido na Fase 13) e passa a reexportar para backends reais:
#   - traces  -> Jaeger, via OTLP/gRPC (Jaeger aceita OTLP nativamente desde a v1.35);
#   - metrics -> Prometheus, via exporter "prometheus" (expõe um endpoint /metrics que o Prometheus faz scrape).
# O exporter "debug" é mantido em ambos os pipelines — útil para depurar localmente sem precisar abrir Jaeger/
# Prometheus. Usa a imagem "contrib" porque o exporter "prometheus" (formato de métricas Prometheus, distinto do
# exporter "otlp/otlphttp" genérico) não faz parte da imagem "core" usada na Fase 13.

receivers:
  # Receiver OTLP: aceita telemetria (traces, metrics e logs) via gRPC (4317) e HTTP/protobuf (4318).
  # API e Worker usam o protocolo HTTP/protobuf (porta 4318), por ser mais simples de configurar
  # localmente do que gRPC em texto claro (cleartext).
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch Processor: agrupa spans/métricas/logs antes de exportar, em vez de fazer uma chamada de rede por
  # item individual. Reduz overhead de rede e é a prática recomendada em qualquer pipeline de produção.
  batch:
    timeout: 5s
    send_batch_size: 512

  # Resource Processor: adiciona/normaliza Resource Attributes em tudo que passa pelo pipeline — aqui,
  # marca a origem dos dados como ambiente local de desenvolvimento, distinto de um futuro deployment.
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  # Debug Exporter: imprime a telemetria recebida no stdout do próprio Collector. Mantido desde a Fase 13
  # para depuração local rápida (docker compose logs otel-collector), em paralelo aos backends reais abaixo.
  debug:
    verbosity: basic

  # OTLP/gRPC para o Jaeger: o Jaeger all-in-one expõe um receiver OTLP nativo em 4317, então o Collector só
  # precisa falar OTLP "puro" com ele — sem exporter dedicado ao formato interno do Jaeger (jaeger-thrift), que
  # está deprecado no ecossistema OpenTelemetry.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Prometheus Exporter: NÃO envia dados para um Prometheus — ele mesmo vira um endpoint de scrape
  # (http://otel-collector:8889/metrics) no formato de texto do Prometheus. É o Prometheus (serviço separado)
  # quem periodicamente busca (pull) esses dados, conforme configurado em prometheus.yml.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug, otlp/jaeger]

    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug, prometheus]

  telemetry:
    logs:
      level: info
