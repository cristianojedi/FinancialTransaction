services:
  postgres:
    image: postgres:16-alpine
    container_name: financialtransaction_postgres
    environment:
      POSTGRES_USER: financialtransaction
      POSTGRES_PASSWORD: financialtransaction
      POSTGRES_DB: financialtransaction
    ports:
      - "5432:5432"
    volumes:
      - financialtransaction-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financialtransaction -d financialtransaction"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - financialtransaction-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: financialtransaction_kafka
    environment:
      # KRaft: Kafka atua como broker e controller no mesmo processo, sem Zookeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Listener interno (rede Docker, usado por Kafka UI e futuras Api/Worker) e externo (host, para debug local).
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - financialtransaction-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - financialtransaction-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: financialtransaction_kafka_ui
    environment:
      KAFKA_CLUSTERS_0_NAME: financialtransaction
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - financialtransaction-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: financialtransaction_otel_collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/docker/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP/protobuf — usado pela Api e pelo Worker
      - "8889:8889" # Prometheus exporter — scrapeado pelo Prometheus
    depends_on:
      - jaeger
    networks:
      - financialtransaction-network

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: financialtransaction_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
    networks:
      - financialtransaction-network

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: financialtransaction_prometheus
    volumes:
      - ./infrastructure/docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - financialtransaction-prometheus-data:/prometheus
    ports:
      - "9090:9090" # Prometheus UI
    depends_on:
      - otel-collector
    networks:
      - financialtransaction-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: financialtransaction_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/docker/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - financialtransaction-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000" # Grafana UI
    depends_on:
      - prometheus
      - jaeger
    networks:
      - financialtransaction-network

networks:
  financialtransaction-network:
    name: financialtransaction-network

volumes:
  financialtransaction-postgres-data:
  financialtransaction-kafka-data:
  financialtransaction-prometheus-data:
  financialtransaction-grafana-data:
