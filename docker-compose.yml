services:
  postgres:
    image: postgres:16-alpine
    container_name: financialtransaction_postgres
    environment:
      POSTGRES_USER: financialtransaction
      POSTGRES_PASSWORD: financialtransaction
      POSTGRES_DB: financialtransaction
    ports:
      - "5432:5432"
    volumes:
      - financialtransaction-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financialtransaction -d financialtransaction"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  financialtransaction-postgres-data:
