# Provisionamento automático de datasources do Grafana — Fase 14.
# Executado uma vez na subida do container; evita configurar manualmente Prometheus e Jaeger na UI.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
